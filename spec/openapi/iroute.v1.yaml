openapi: 3.1.0
info:
  title: iRoute Runtime API
  version: 1.0.0
  description: Task-aware execution, event streaming, reusable artifacts, and privacy-safe observability API.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - {}
paths:
  /v1/executions:
    post:
      operationId: createExecution
      tags: [Executions]
      summary: Persist and submit one typed task for execution.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/PermissionScopes'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '202':
          description: The execution was persisted and is queued, resolved by the no-model fast path, or paused in `WaitingForApproval`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSnapshot'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/executions/{executionId}:
    get:
      operationId: getExecution
      tags: [Executions]
      summary: Get the current execution snapshot.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Current execution state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionSnapshot'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/executions/{executionId}/events:
    get:
      operationId: streamExecutionEvents
      tags: [Executions]
      summary: Stream ordered execution events using Server-Sent Events.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/TenantId'
        - name: after
          in: query
          description: Return events after this sequence number.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: Last-Event-ID
          in: header
          description: SSE reconnection cursor used when `after` is omitted.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Each SSE `data` field contains one serialized ExecutionEvent.
          x-sse-frame:
            id: TaskEvent.sequence
            event: TaskEvent.type
            data: TaskEvent JSON
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TaskEvent'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/executions/{executionId}/cancel:
    post:
      operationId: cancelExecution
      tags: [Executions]
      summary: Request cancellation of a non-terminal execution.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '202':
          description: Cancellation was recorded and signalled to the local executor.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/executions/{executionId}/approvals:
    post:
      operationId: submitExecutionApproval
      tags: [Executions]
      summary: Approve or deny a pending external action and resume the durable workflow when approved.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/PermissionScopes'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: The approval decision and current execution snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/executions/{executionId}/external-actions:
    get:
      operationId: listUnresolvedExternalActions
      tags: [Executions]
      summary: List external actions whose outcome is unknown because the worker stopped mid call.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/PermissionScopes'
      responses:
        '200':
          description: Unresolved external actions for the execution.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnresolvedExternalAction'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/executions/{executionId}/external-actions/{actionId}/reconcile:
    post:
      operationId: reconcileExternalAction
      tags: [Executions]
      summary: Record what an indeterminate external action actually did, releasing its reservation.
      description: >-
        iRoute refuses to retry an action whose outcome is unknown, so it can never fire an
        irreversible side effect twice. Only an operator who has established what happened outside
        iRoute can release the reservation. Recording success makes a resubmission carrying the same
        idempotency key reuse the result; recording failure allows it to be attempted again.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - name: actionId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/PermissionScopes'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalActionReconciliation'
      responses:
        '200':
          description: The reconciled external action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnresolvedExternalAction'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [Artifacts]
      summary: Get a materialized artifact and its provenance.
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Artifact content and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSnapshot'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/observability/summary:
    get:
      operationId: getObservabilitySummary
      tags: [Observability]
      summary: Compare execution quality, cost, latency, and memory behavior by task and policy.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: from
          in: query
          description: Inclusive window start. Defaults to 24 hours before `to`.
          schema: { type: [string, 'null'], format: date-time }
        - name: to
          in: query
          description: Inclusive window end. Defaults to the current runtime time.
          schema: { type: [string, 'null'], format: date-time }
        - name: taskType
          in: query
          schema: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        - name: policyVersion
          in: query
          schema: { type: [string, 'null'], minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Bounded, tenant-scoped observability aggregates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilitySummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/observability/executions/{executionId}:
    get:
      operationId: getExecutionTimeline
      tags: [Observability]
      summary: Inspect one redacted execution timeline and its trace correlation identifier.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Ordered and bounded execution timeline. Event data is metadata-only by default; recursively redacted fields are an operator opt-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTimeline'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Check whether the API process is live.
      responses:
        '200':
          description: Process is live.
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check whether required runtime dependencies are ready.
      responses:
        '200':
          description: Required dependencies are ready.
        '503':
          description: At least one required dependency is unavailable.
  /health/model-gateway:
    get:
      operationId: getModelGatewayHealth
      tags: [Health]
      summary: Report the configured optional model gateway's normalized health.
      responses:
        '200':
          description: The gateway is healthy or degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGatewayHealth'
        '503':
          description: The optional model gateway is unavailable. API readiness is unaffected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGatewayHealth'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Required when `Identity:Mode` is `Jwt`.
  parameters:
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Development-only tenant scope. JWT mode ignores this header and uses the configured tenant claim.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      description: Development-only actor scope. JWT mode ignores this header and uses the configured actor claim.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PermissionScopes:
      name: X-Permission-Scopes
      in: header
      required: false
      description: Development-only space- or comma-separated permission scopes. JWT mode ignores this header and uses the configured permission claim.
      schema:
        type: string
        maxLength: 4096
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Tenant-scoped idempotency key. A body value must match this header.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Problem:
      description: RFC 9457 problem details with a stable iRoute error code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HttpProblem'
  schemas:
    TaskRequest:
      type: object
      additionalProperties: false
      required: [taskType, input]
      properties:
        taskType:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_.-]+$'
        input: {}
        projectId:
          type: [string, 'null']
          maxLength: 200
        idempotencyKey:
          type: [string, 'null']
          maxLength: 200
        constraints:
          oneOf:
            - $ref: '#/components/schemas/TaskConstraints'
            - type: 'null'
        metadata:
          type: [object, 'null']
          description: Optional routing metadata. The reserved `artifactKey` value selects an artifact lineage and is limited to 200 characters.
          additionalProperties:
            type: string
          maxProperties: 32
        tenantId:
          type: [string, 'null']
          maxLength: 200
          description: Development scope hint. In JWT mode, a supplied value must match the authenticated claim.
        actorId:
          type: [string, 'null']
          maxLength: 200
          description: Development scope hint. In JWT mode, a supplied value must match the authenticated claim.
        permissionScopes:
          type: [array, 'null']
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Server-derived authorization context. Request-body values are ignored and replaced by authenticated scopes.
    TaskConstraints:
      type: object
      additionalProperties: false
      properties:
        maxInputTokens: { type: [integer, 'null'], minimum: 1, maximum: 2000000 }
        maxOutputTokens: { type: [integer, 'null'], minimum: 1, maximum: 200000 }
        maxCost: { type: [number, 'null'], minimum: 0 }
        deadlineMilliseconds: { type: [integer, 'null'], minimum: 1, maximum: 900000 }
        minimumQuality: { type: [number, 'null'], minimum: 0, maximum: 1 }
        requireEvidence: { type: boolean, default: false }
        allowExternalWrites: { type: boolean, default: false }
        maxModelCalls: { type: [integer, 'null'], minimum: 0, maximum: 16 }
        maxToolCalls: { type: [integer, 'null'], minimum: 0, maximum: 64 }
        maxParallelCalls: { type: [integer, 'null'], minimum: 1, maximum: 32 }
        maxTaskDepth: { type: [integer, 'null'], minimum: 1, maximum: 16 }
        allowedRegions:
          type: [array, 'null']
          uniqueItems: true
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 200 }
        requiredResidency: { type: [string, 'null'], maxLength: 200 }
    ExecutionSnapshot:
      type: object
      additionalProperties: false
      required: [executionId, taskType, status, createdAt, updatedAt, tenantId, actorId]
      properties:
        executionId: { type: string, format: uuid }
        taskType: { type: string }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/TaskOutcome'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/ExecutionProblem'
            - type: 'null'
        tenantId: { type: string }
        actorId: { type: string }
        projectId: { type: [string, 'null'] }
        taskDefinitionVersion: { type: [integer, 'null'], minimum: 1 }
        cancellationRequestedAt: { type: [string, 'null'], format: date-time }
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [actionId, approved]
      properties:
        actionId: { type: string, minLength: 1, maxLength: 200 }
        approved: { type: boolean }
        reason: { type: [string, 'null'], maxLength: 2000 }
    ApprovalSnapshot:
      type: object
      additionalProperties: false
      required: [executionId, actionId, status, capability, sideEffectClass, requiredPermissionScopes, requestedByActorId, inputReference, idempotencyReference, createdAt]
      properties:
        executionId: { type: string, format: uuid }
        actionId: { type: string }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        capability: { type: string }
        sideEffectClass: { $ref: '#/components/schemas/SideEffectClass' }
        requiredPermissionScopes:
          type: array
          uniqueItems: true
          items: { type: string }
        requestedByActorId: { type: string }
        decidedByActorId: { type: [string, 'null'] }
        inputReference: { type: string }
        idempotencyReference: { type: string }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
    ApprovalResult:
      type: object
      additionalProperties: false
      required: [approval, execution]
      properties:
        approval: { $ref: '#/components/schemas/ApprovalSnapshot' }
        execution: { $ref: '#/components/schemas/ExecutionSnapshot' }
    ApprovalStatus:
      type: string
      enum: [Pending, Approved, Denied]
    SideEffectClass:
      type: string
      enum: [None, ReadOnly, ReversibleWrite, IrreversibleWrite]
    ExecutionStatus:
      type: string
      enum:
        - Accepted
        - Resolving
        - Planning
        - Queued
        - WaitingForApproval
        - Running
        - Validating
        - Materializing
        - Compensating
        - Succeeded
        - Failed
        - Cancelled
        - TimedOut
    TaskOutcome:
      type: object
      additionalProperties: false
      required: [output, resolutionLevel, confidence, evidence, usage, artifacts]
      properties:
        output: {}
        resolutionLevel:
          $ref: '#/components/schemas/ResolutionLevel'
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceReference' }
        usage: { $ref: '#/components/schemas/UsageSummary' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/ArtifactReference' }
        validation:
          oneOf:
            - $ref: '#/components/schemas/ValidationSummary'
            - type: 'null'
        context:
          oneOf:
            - $ref: '#/components/schemas/ContextManifest'
            - type: 'null'
        routing:
          oneOf:
            - $ref: '#/components/schemas/RoutingDecision'
            - type: 'null'
    ResolutionLevel:
      type: string
      enum:
        - ExactArtifact
        - StructuredState
        - SemanticMemory
        - DeterministicCapability
        - SmallModel
        - StrongModel
        - VerifiedOrHuman
    EvidenceReference:
      type: object
      additionalProperties: false
      required: [kind, reference]
      properties:
        kind: { type: string }
        reference: { type: string }
        contentHash: { type: [string, 'null'] }
        observedAt: { type: [string, 'null'], format: date-time }
    DependencyReference:
      type: object
      additionalProperties: false
      required: [kind, reference]
      properties:
        kind: { type: string, minLength: 1, maxLength: 120 }
        reference: { type: string, minLength: 1, maxLength: 500 }
        contentHash: { type: [string, 'null'], maxLength: 256 }
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [artifactId, artifactType, version, contentHash]
      properties:
        artifactId: { type: string, format: uuid }
        artifactType: { type: string }
        version: { type: integer, minimum: 1 }
        contentHash: { type: string }
    ArtifactSnapshot:
      type: object
      additionalProperties: false
      required:
        - artifact
        - tenantId
        - taskType
        - taskDefinitionVersion
        - content
        - evidence
        - createdAt
        - isActive
      properties:
        artifact: { $ref: '#/components/schemas/ArtifactReference' }
        tenantId: { type: string }
        projectId: { type: [string, 'null'] }
        taskType: { type: string }
        taskDefinitionVersion: { type: integer, minimum: 1 }
        content: {}
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceReference' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        isActive: { type: boolean }
        logicalKey: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        lifecycleStatus: { $ref: '#/components/schemas/ArtifactLifecycleStatus' }
        supersedesArtifactId: { type: [string, 'null'], format: uuid }
        supersededByArtifactId: { type: [string, 'null'], format: uuid }
        dependencies:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/DependencyReference' }
        invalidatedAt: { type: [string, 'null'], format: date-time }
        invalidationReason: { type: [string, 'null'], maxLength: 2000 }
    ArtifactLifecycleStatus:
      type: string
      enum: [Active, Superseded, Invalidated]
    MemorySnapshot:
      type: object
      additionalProperties: false
      required: [memoryId, tenantId, kind, key, version, value, contentHash, lifecycleStatus, evidence, dependencies, createdAt]
      properties:
        memoryId: { type: string, format: uuid }
        tenantId: { type: string, minLength: 1, maxLength: 200 }
        projectId: { type: [string, 'null'], maxLength: 200 }
        kind: { $ref: '#/components/schemas/MemoryKind' }
        key: { type: string, minLength: 1, maxLength: 200 }
        version: { type: integer, minimum: 1 }
        value: {}
        contentHash: { type: string, minLength: 1, maxLength: 256 }
        lifecycleStatus: { $ref: '#/components/schemas/MemoryLifecycleStatus' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceReference' }
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/DependencyReference' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        supersedesMemoryId: { type: [string, 'null'], format: uuid }
        supersededByMemoryId: { type: [string, 'null'], format: uuid }
        invalidatedAt: { type: [string, 'null'], format: date-time }
        invalidationReason: { type: [string, 'null'], maxLength: 2000 }
    MemoryKind:
      type: string
      enum: [Fact, Decision]
    MemoryLifecycleStatus:
      type: string
      enum: [Active, Superseded, Invalidated]
    ObservabilitySummary:
      type: object
      additionalProperties: false
      required: [from, to, truncated, sampledExecutions, totals, groups, memory, recentExecutions]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        truncated: { type: boolean }
        sampledExecutions: { type: integer, minimum: 0 }
        totals: { $ref: '#/components/schemas/ObservabilityMetricSet' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ObservabilityMetricGroup' }
        memory: { $ref: '#/components/schemas/MemoryHitDiagnostics' }
        recentExecutions:
          type: array
          items: { $ref: '#/components/schemas/ObservabilityExecutionItem' }
        gatewayGroups:
          type: array
          items: { $ref: '#/components/schemas/GatewayObservabilityMetricGroup' }
    ObservabilityMetricSet:
      type: object
      additionalProperties: false
      required: [executions, completed, failed, completionRate, averageQuality, inputTokens, outputTokens, cost, averageLatencyMilliseconds, modelCalls, toolCalls, noModelResolutions, modelCallsAvoided]
      properties:
        executions: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        completionRate: { type: number, minimum: 0, maximum: 1 }
        averageQuality: { type: number, minimum: 0, maximum: 1 }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cost: { type: number, minimum: 0 }
        averageLatencyMilliseconds: { type: number, minimum: 0 }
        modelCalls: { type: integer, minimum: 0 }
        toolCalls: { type: integer, minimum: 0 }
        noModelResolutions: { type: integer, minimum: 0 }
        modelCallsAvoided: { type: integer, minimum: 0 }
    ObservabilityMetricGroup:
      type: object
      additionalProperties: false
      required: [taskType, policyVersion, metrics]
      properties:
        taskType: { type: string }
        policyVersion: { type: string }
        metrics: { $ref: '#/components/schemas/ObservabilityMetricSet' }
    GatewayObservabilityMetricGroup:
      type: object
      additionalProperties: false
      required: [gatewayId, provider, deploymentId, region, modelVersion, failureClass, circuitState, metrics]
      properties:
        gatewayId: { type: string }
        provider: { type: string }
        deploymentId: { type: string }
        region: { type: string }
        modelVersion: { type: string }
        failureClass: { $ref: '#/components/schemas/GatewayFailureClass' }
        circuitState: { $ref: '#/components/schemas/GatewayCircuitState' }
        metrics: { $ref: '#/components/schemas/GatewayObservabilityMetricSet' }
    GatewayObservabilityMetricSet:
      type: object
      additionalProperties: false
      required: [attempts, successes, failures, rejectedCandidates, fallbacks, averageLatencyMilliseconds]
      properties:
        attempts: { type: integer, minimum: 0 }
        successes: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        rejectedCandidates: { type: integer, minimum: 0 }
        fallbacks: { type: integer, minimum: 0 }
        averageLatencyMilliseconds: { type: number, minimum: 0 }
    MemoryHitDiagnostics:
      type: object
      additionalProperties: false
      required: [considered, accepted, rejected, hitRate, resolvers]
      properties:
        considered: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        hitRate: { type: number, minimum: 0, maximum: 1 }
        resolvers:
          type: array
          items: { $ref: '#/components/schemas/MemoryResolverDiagnostic' }
    MemoryResolverDiagnostic:
      type: object
      additionalProperties: false
      required: [resolver, considered, accepted, rejected, reasons]
      properties:
        resolver: { type: string }
        considered: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        reasons:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    ObservabilityExecutionItem:
      type: object
      additionalProperties: false
      required: [executionId, taskType, policyVersion, status, startedAt, durationMilliseconds, resolutionLevel, quality, cost, inputTokens, outputTokens]
      properties:
        executionId: { type: string, format: uuid }
        taskType: { type: string }
        policyVersion: { type: string }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        startedAt: { type: string, format: date-time }
        durationMilliseconds: { type: integer, format: int64, minimum: 0 }
        resolutionLevel:
          oneOf:
            - $ref: '#/components/schemas/ResolutionLevel'
            - type: 'null'
        quality: { type: [number, 'null'], minimum: 0, maximum: 1 }
        cost: { type: number, minimum: 0 }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
    ExecutionTimeline:
      type: object
      additionalProperties: false
      required: [executionId, traceId, taskType, taskDefinitionVersion, policyVersion, status, startedAt, updatedAt, durationMilliseconds, actorReference, projectReference, payloadMode, truncated, events]
      properties:
        executionId: { type: string, format: uuid }
        traceId: { type: string, minLength: 1, maxLength: 64 }
        taskType: { type: string }
        taskDefinitionVersion: { type: [integer, 'null'], minimum: 1 }
        policyVersion: { type: string }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        durationMilliseconds: { type: integer, format: int64, minimum: 0 }
        actorReference: { type: string, pattern: '^sha256:[a-f0-9]{16}$' }
        projectReference: { type: [string, 'null'], pattern: '^sha256:[a-f0-9]{16}$' }
        payloadMode: { $ref: '#/components/schemas/ObservabilityPayloadMode' }
        truncated: { type: boolean }
        events:
          type: array
          items: { $ref: '#/components/schemas/ExecutionTimelineEntry' }
    ExecutionTimelineEntry:
      type: object
      additionalProperties: false
      required: [sequence, type, occurredAt, offsetMilliseconds, data]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        offsetMilliseconds: { type: integer, format: int64, minimum: 0 }
        data:
          type: object
          additionalProperties: true
    ObservabilityPayloadMode:
      type: string
      enum: [MetadataOnly, Redacted]
    UsageSummary:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, cost, durationMilliseconds, modelCalls, toolCalls]
      properties:
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        cost: { type: number, minimum: 0 }
        durationMilliseconds: { type: integer, format: int64, minimum: 0 }
        modelCalls: { type: integer, minimum: 0 }
        toolCalls: { type: integer, minimum: 0 }
    ValidationSummary:
      type: object
      additionalProperties: false
      required: [passed, quality, checks, failures]
      properties:
        passed: { type: boolean }
        quality: { type: number, minimum: 0, maximum: 1 }
        checks:
          type: array
          items: { type: string }
        failures:
          type: array
          items: { type: string }
    ContextManifest:
      type: object
      additionalProperties: false
      required: [estimatedTokens, budgetTokens, projectedInputTokens, contextTokens, truncated, fullHistoryIncluded, entries, provenance]
      properties:
        estimatedTokens: { type: integer, minimum: 0 }
        budgetTokens: { type: integer, minimum: 0 }
        projectedInputTokens: { type: integer, minimum: 0 }
        contextTokens: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        fullHistoryIncluded: { type: boolean }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ContextManifestEntry' }
        provenance:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EvidenceReference'
    ContextManifestEntry:
      type: object
      additionalProperties: false
      required: [kind, reference, included, reason, estimatedTokens, rank, outputPath]
      properties:
        kind: { type: string }
        reference: { type: string }
        included: { type: boolean }
        reason: { type: string }
        estimatedTokens: { type: integer, minimum: 0 }
        contentHash: { type: [string, 'null'] }
        rank: { type: integer, minimum: 0 }
        outputPath: { type: [string, 'null'] }
    RoutingDecision:
      type: object
      additionalProperties: false
      required: [policyVersion, path, reason, selectedCapability, selectedProfileId, selectedModelTier, qualityFloor, expectedQuality, expectedCost, expectedLatencyMilliseconds, uncertainty, score, plannerInvoked, planningCalls, escalated, escalationReason, candidates]
      properties:
        policyVersion: { type: string }
        path: { $ref: '#/components/schemas/RoutingPath' }
        reason: { type: string }
        selectedCapability: { type: string }
        selectedProfileId: { type: [string, 'null'] }
        selectedModelTier:
          oneOf:
            - $ref: '#/components/schemas/ModelTier'
            - type: 'null'
        qualityFloor: { type: number, minimum: 0, maximum: 1 }
        expectedQuality: { type: number, minimum: 0, maximum: 1 }
        expectedCost: { type: number, minimum: 0 }
        expectedLatencyMilliseconds: { type: integer, minimum: 0 }
        uncertainty: { type: number, minimum: 0, maximum: 1 }
        score: { type: number }
        plannerInvoked: { type: boolean }
        planningCalls: { type: integer, minimum: 0, maximum: 1 }
        escalated: { type: boolean }
        escalationReason: { type: [string, 'null'] }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/RoutingCandidateEvaluation' }
        selectedDeployment:
          oneOf:
            - $ref: '#/components/schemas/GatewayDeploymentReference'
            - type: 'null'
        resilience:
          oneOf:
            - $ref: '#/components/schemas/GatewayResilienceTrace'
            - type: 'null'
    RoutingCandidateEvaluation:
      type: object
      additionalProperties: false
      required: [capability, profileId, modelTier, eligible, reason, expectedQuality, expectedCost, expectedLatencyMilliseconds, uncertainty, reliability, availability, score]
      properties:
        capability: { type: string }
        profileId: { type: [string, 'null'] }
        modelTier:
          oneOf:
            - $ref: '#/components/schemas/ModelTier'
            - type: 'null'
        eligible: { type: boolean }
        reason: { type: string }
        expectedQuality: { type: number, minimum: 0, maximum: 1 }
        expectedCost: { type: number, minimum: 0 }
        expectedLatencyMilliseconds: { type: integer, minimum: 0 }
        uncertainty: { type: number, minimum: 0, maximum: 1 }
        reliability: { type: number, minimum: 0, maximum: 1 }
        availability: { type: number, minimum: 0, maximum: 1 }
        score: { type: number }
        measurementSource:
          oneOf:
            - $ref: '#/components/schemas/ModelProfileSource'
            - type: 'null'
        measurement:
          oneOf:
            - $ref: '#/components/schemas/ModelProfileMeasurement'
            - type: 'null'
    GatewayDeploymentReference:
      type: object
      additionalProperties: false
      required: [gatewayId, provider, deploymentId, region, residency, modelVersion]
      properties:
        gatewayId: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, minLength: 1, maxLength: 200 }
        deploymentId: { type: string, minLength: 1, maxLength: 200 }
        region: { type: string, minLength: 1, maxLength: 200 }
        residency: { type: string, minLength: 1, maxLength: 200 }
        modelVersion: { type: string, minLength: 1, maxLength: 200 }
    GatewayFailureClass:
      type: [string, 'null']
      enum: [Timeout, Throttling, Transport, Provider, MalformedOutput, Validation, Policy, Permanent, null]
    GatewayCircuitState:
      type: string
      enum: [Closed, Open, HalfOpen]
    GatewayCandidateEvidence:
      type: object
      additionalProperties: false
      required: [deployment, eligible, reason, circuitState, failureClass]
      properties:
        deployment: { $ref: '#/components/schemas/GatewayDeploymentReference' }
        eligible: { type: boolean }
        reason: { type: string }
        circuitState: { $ref: '#/components/schemas/GatewayCircuitState' }
        failureClass: { $ref: '#/components/schemas/GatewayFailureClass' }
    GatewayAttemptEvidence:
      type: object
      additionalProperties: false
      required: [deployment, attempt, circuitStateBefore, circuitStateAfter, succeeded, failureClass, failureCode, statusCode, durationMilliseconds, retryAfterMilliseconds]
      properties:
        deployment: { $ref: '#/components/schemas/GatewayDeploymentReference' }
        attempt: { type: integer, minimum: 1, maximum: 10 }
        circuitStateBefore: { $ref: '#/components/schemas/GatewayCircuitState' }
        circuitStateAfter: { $ref: '#/components/schemas/GatewayCircuitState' }
        succeeded: { type: boolean }
        failureClass: { $ref: '#/components/schemas/GatewayFailureClass' }
        failureCode: { type: [string, 'null'] }
        statusCode: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        durationMilliseconds: { type: integer, format: int64, minimum: 0 }
        retryAfterMilliseconds: { type: [integer, 'null'], minimum: 0 }
    GatewayResilienceTrace:
      type: object
      additionalProperties: false
      required: [policyVersion, candidates, attempts, finalDeployment, fallbackReason, exhaustionReason]
      properties:
        policyVersion: { type: string }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/GatewayCandidateEvidence' }
        attempts:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/GatewayAttemptEvidence' }
        finalDeployment:
          oneOf:
            - $ref: '#/components/schemas/GatewayDeploymentReference'
            - type: 'null'
        fallbackReason: { type: [string, 'null'] }
        exhaustionReason: { type: [string, 'null'] }
    RoutingPath:
      type: string
      enum: [Direct, Workflow]
    ModelTier:
      type: string
      enum: [Small, Strong, Verifier]
    ModelProfileSource:
      type: string
      enum: [Synthetic, Unverified, Measured]
    ModelProfileMeasurement:
      type: object
      additionalProperties: false
      required: [provider, model, measuredAt, sampleCount, qualityIsDeclaredNotMeasured]
      properties:
        provider: { type: string, minLength: 1, maxLength: 200 }
        model: { type: string, minLength: 1, maxLength: 200 }
        measuredAt: { type: string, format: date-time }
        sampleCount: { type: integer, minimum: 1 }
        qualityIsDeclaredNotMeasured: { type: boolean }
    ModelProfile:
      type: object
      additionalProperties: false
      required: [profileId, capability, tier, supportedTaskTypes, expectedQuality, estimatedCost, expectedLatencyMilliseconds, uncertainty, reliability, availability, maxInputTokens, maxOutputTokens, healthy, measurementSource]
      properties:
        profileId: { type: string }
        capability: { type: string }
        tier: { $ref: '#/components/schemas/ModelTier' }
        supportedTaskTypes:
          type: array
          uniqueItems: true
          items: { type: string }
        expectedQuality: { type: number, minimum: 0, maximum: 1 }
        estimatedCost: { type: number, minimum: 0 }
        expectedLatencyMilliseconds: { type: integer, minimum: 0 }
        uncertainty: { type: number, minimum: 0, maximum: 1 }
        reliability: { type: number, minimum: 0, maximum: 1 }
        availability: { type: number, minimum: 0, maximum: 1 }
        maxInputTokens: { type: integer, minimum: 1 }
        maxOutputTokens: { type: integer, minimum: 1 }
        healthy: { type: boolean }
        measurementSource: { $ref: '#/components/schemas/ModelProfileSource' }
        measurement:
          oneOf:
            - $ref: '#/components/schemas/ModelProfileMeasurement'
            - type: 'null'
    ModelGatewayHealth:
      type: object
      additionalProperties: false
      required: [gatewayId, status, latencyMilliseconds, checkedAt]
      properties:
        gatewayId: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/ModelGatewayHealthStatus' }
        latencyMilliseconds: { type: integer, format: int64, minimum: 0 }
        checkedAt: { type: string, format: date-time }
        message: { type: [string, 'null'], maxLength: 1000 }
    ModelGatewayHealthStatus:
      type: string
      enum: [Healthy, Degraded, Unavailable]
    TaskEvent:
      type: object
      additionalProperties: false
      required: [sequence, executionId, type, occurredAt, data]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        executionId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TaskEventType' }
        occurredAt: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
    ResolutionConsideration:
      type: object
      additionalProperties: false
      required: [resolver, accepted, code, reason, permissionChecked, freshnessChecked, checks]
      properties:
        resolver: { type: string, minLength: 1, maxLength: 120 }
        accepted: { type: boolean }
        code: { $ref: '#/components/schemas/ResolutionDecisionCode' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        permissionChecked: { type: boolean }
        freshnessChecked: { type: boolean }
        checks: { type: integer, minimum: 0 }
        level:
          oneOf:
            - $ref: '#/components/schemas/ResolutionLevel'
            - type: 'null'
    ResolutionDecisionCode:
      type: string
      description: Stable no-model resolver decision code. Additive codes may be introduced in v1.
      enum:
        - exact_cache_hit
        - exact_cache_miss
        - permission_denied
        - unsupported_task
        - project_scope_required
        - state_key_required
        - state_hit
        - state_unavailable
        - artifact_reference_required
        - artifact_hit
        - artifact_unavailable
        - handler_unavailable
        - handler_declined
        - handler_stale
        - handler_accepted
        - external_write_blocked
        - validation_failed
    TaskEventType:
      type: string
      description: Additive event types may be introduced in v1; consumers must ignore unknown types.
      enum:
        - execution.created
        - execution.status_changed
        - execution.queued
        - execution.lease_claimed
        - execution.lease_renewed
        - execution.lease_released
        - resolution.considered
        - routing.decided
        - routing.escalated
        - plan.validated
        - policy.evaluated
        - capability.denied
        - capability.started
        - capability.completed
        - capability.failed
        - approval.required
        - approval.decided
        - workflow.checkpointed
        - workflow.resumed
        - step.started
        - step.completed
        - step.retry_scheduled
        - step.failed
        - external_action.started
        - external_action.completed
        - external_action.reused
        - external_action.failed
        - external_action.reconciled
        - context.compiled
        - gateway.started
        - gateway.streamed
        - gateway.completed
        - gateway.failed
        - gateway.candidate_evaluated
        - gateway.attempted
        - gateway.fallback_selected
        - gateway.circuit_changed
        - gateway.exhausted
        - gateway.resilience_decided
        - validation.completed
        - artifact.materialized
        - artifact.superseded
        - artifact.invalidated
        - memory.materialized
        - memory.superseded
        - memory.invalidated
        - execution.cancellation_requested
        - execution.completed
        - execution.failed
    UnresolvedExternalAction:
      type: object
      additionalProperties: false
      required: [actionId, capability, status, createdAt, updatedAt]
      properties:
        actionId: { type: string, maxLength: 64 }
        capability: { type: string, maxLength: 200 }
        status:
          type: string
          enum: [Running, Succeeded, Failed]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExternalActionReconciliation:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [succeeded, failed]
          description: What the operator established actually happened outside iRoute.
        detail:
          type: [string, 'null']
          maxLength: 4000
          description: Evidence recorded with the decision.
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Additive codes may be introduced in v1.
      enum:
        - idempotency_key_conflict
        - identity_scope_conflict
        - invalid_task_request
        - execution_already_terminal
        - unknown_task_type
        - invalid_execution_plan
        - routing_no_eligible_capability
        - routing_budget_exceeded
        - workflow_step_failed
        - workflow_step_timed_out
        - validation_failed
        - execution_timed_out
        - execution_cancelled
        - execution_failed
        - external_write_not_allowed
        - capability_not_allowed
        - capability_not_registered
        - capability_contract_mismatch
        - capability_invocation_failed
        - capability_result_invalid
        - capability_output_limit_exceeded
        - capability_deadline_exceeded
        - permission_scope_denied
        - approval_not_found
        - approval_already_decided
        - approval_denied
        - external_action_idempotency_required
        - external_action_idempotency_conflict
        - external_action_in_progress
        - external_action_failed
        - model_budget_exhausted
        - context_budget_exceeded
        - cost_budget_exceeded
        - model_call_budget_exceeded
        - model_gateway_unavailable
        - model_gateway_http_error
        - model_gateway_invalid_response
        - model_gateway_exhausted
    ExecutionProblem:
      type: object
      additionalProperties: false
      required: [code, title, detail, retryable]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        title: { type: string }
        detail: { type: string }
        retryable: { type: boolean }
        metadata:
          type: [object, 'null']
          additionalProperties: { type: string }
    HttpProblem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { $ref: '#/components/schemas/ErrorCode' }
