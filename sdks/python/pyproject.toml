[project]
name = "iroute"
version = "0.1.0a1"
description = "Thin Python client for the iRoute runtime"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "iRoute contributors" }]
keywords = ["ai", "llm", "router", "sdk", "task-aware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
