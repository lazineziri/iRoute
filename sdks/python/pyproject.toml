[project]
name = "iroute"
version = "0.1.0a2"
description = "Thin Python client for the iRoute runtime"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "iRoute contributors" }]
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "llm", "router", "sdk", "task-aware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://iroute.dev/docs/sdk/python"
Documentation = "https://iroute.dev/docs/sdk/python"
Repository = "https://github.com/lazineziri/iRoute"
Issues = "https://github.com/lazineziri/iRoute/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
