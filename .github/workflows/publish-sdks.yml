name: publish-sdks

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Public registry to publish
        required: true
        type: choice
        options: [verify-only, npm, nuget, pypi, crates]
      version:
        description: Exact release version without the v prefix
        required: true
        default: 0.1.0-alpha.3
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.registry }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # What gets published is pinned to the release tag, not to the ref this run was dispatched
      # from. The workflow definition therefore lives on the default branch and can be fixed
      # without rewriting a tag, while the published code stays immutable and signed.
      #
      # Inputs reach the shell through the environment, never through template interpolation:
      # these jobs hold registry publishing credentials, so a crafted version must not become
      # shell, and it must not reach actions/checkout as a ref either.
      - name: Check out the signed release tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish a version that is not plain semver: ${VERSION}" >&2
            exit 1
          fi

          tag="v${VERSION}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Refusing to publish: tag ${tag} does not exist." >&2
            exit 1
          fi

          # An annotated, signature-verified tag is the thing being released. A lightweight or
          # unverified tag means the release was not produced by the documented process.
          if [[ "$(git cat-file -t "${tag}")" != "tag" ]]; then
            echo "Refusing to publish: ${tag} is lightweight, not an annotated release tag." >&2
            exit 1
          fi
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(git rev-parse "${tag}")" \
            --jq '.verification.verified')"
          if [[ "${verified}" != "true" ]]; then
            echo "Refusing to publish: the signature on ${tag} is not verified by GitHub." >&2
            exit 1
          fi

          git checkout -q --detach "refs/tags/${tag}"
          test "$(node -p "require('./release.json').version")" = "${VERSION}"
          echo "Publishing ${tag} at $(git rev-parse HEAD)"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm ci --prefix sdks/node
      - run: dotnet restore iRoute.slnx
      - run: dotnet build iRoute.slnx --configuration Release --no-restore
      - run: npm run test:release
      - run: node tools/build-release.mjs --output artifacts/release --require-clean
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build sdks/python --outdir artifacts/python
      - uses: actions/upload-artifact@v7
        with:
          name: public-sdk-${{ github.sha }}
          path: |
            artifacts/release/
            artifacts/python/
          if-no-files-found: error
          retention-days: 3

  npm:
    if: inputs.registry == 'npm'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The tarball name is derived from the package name by `npm pack`, so it is discovered
      # rather than reconstructed here.
      - name: Publish the Node.js SDK
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tarball="$(ls artifacts/release/*.tgz)"
          test -f "${tarball}"

          dist_tag="latest"
          if [[ "${VERSION}" == *-* ]]; then
            dist_tag="${VERSION#*-}"
            dist_tag="${dist_tag%%.*}"
          fi

          npm publish "${tarball}" --access public --tag "${dist_tag}"

  nuget:
    if: inputs.registry == 'nuget'
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      # This job only pushes prebuilt packages, so it needs a .NET 10 CLI rather than the
      # repository's exact SDK pin. It also never checks the repository out, which is why
      # global-json-file cannot be used here: setup-dotnet v6 fails when the file is absent.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      # iRoute.Sdk depends on iRoute.Contracts, so contracts must land first. Both the version and
      # the minted key reach the shell through the environment rather than template interpolation.
      - name: Publish contracts before the SDK
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in iRoute.Contracts iRoute.Sdk; do
            dotnet nuget push "artifacts/release/${package}.${VERSION}.nupkg" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json
          done

  pypi:
    if: inputs.registry == 'pypi'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/python/

  crates:
    if: inputs.registry == 'crates'
    needs: verify
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      # cargo publishes from a working tree rather than a prebuilt artifact, so this job has to
      # check the tag out itself. Without the explicit checkout it would publish whatever the
      # dispatched ref happens to contain.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out the release tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git checkout -q --detach "refs/tags/v${VERSION}"
          test "$(node -p "require('./release.json').version")" = "${VERSION}"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the Rust SDK
        run: cargo publish --locked --manifest-path sdks/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
