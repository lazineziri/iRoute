name: publish-sdks

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Public registry to publish
        required: true
        type: choice
        options: [verify-only, npm, nuget, pypi, crates]
      version:
        description: Exact release version without the v prefix
        required: true
        default: 0.1.0-alpha.2
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.registry }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require an immutable matching release tag
        shell: bash
        # Inputs are passed through the environment, never interpolated into the script: these
        # jobs hold registry publishing credentials, so a crafted version string must not be able
        # to become shell.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish a version that is not plain semver: ${VERSION}" >&2
            exit 1
          fi
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test "$(node -p "require('./release.json').version")" = "${VERSION}"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm ci --prefix sdks/node
      - run: dotnet restore iRoute.slnx
      - run: dotnet build iRoute.slnx --configuration Release --no-restore
      - run: npm run test:release
      - run: node tools/build-release.mjs --output artifacts/release --require-clean
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build sdks/python --outdir artifacts/python
      - uses: actions/upload-artifact@v7
        with:
          name: public-sdk-${{ github.sha }}
          path: |
            artifacts/release/
            artifacts/python/
          if-no-files-found: error
          retention-days: 3

  npm:
    if: inputs.registry == 'npm'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The tarball name is derived from the package name by `npm pack`, so it is discovered
      # rather than reconstructed here.
      - name: Publish the Node.js SDK
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls artifacts/release/*.tgz)"
          test -f "${tarball}"
          npm publish "${tarball}" --access public

  nuget:
    if: inputs.registry == 'nuget'
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      # iRoute.Sdk depends on iRoute.Contracts, so contracts must land first. Both the version and
      # the minted key reach the shell through the environment rather than template interpolation.
      - name: Publish contracts before the SDK
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in iRoute.Contracts iRoute.Sdk; do
            dotnet nuget push "artifacts/release/${package}.${VERSION}.nupkg" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json
          done

  pypi:
    if: inputs.registry == 'pypi'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/python/

  crates:
    if: inputs.registry == 'crates'
    needs: verify
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the Rust SDK
        run: cargo publish --locked --manifest-path sdks/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
