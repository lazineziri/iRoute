name: publish-sdks

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Public registry to publish
        required: true
        type: choice
        options: [verify-only, npm, nuget, pypi, crates]
      version:
        description: Exact release version without the v prefix
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.registry }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require an immutable matching release tag
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${{ inputs.version }}"
          test "$(node -p "require('./release.json').version")" = "${{ inputs.version }}"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm ci --prefix sdks/node
      - run: dotnet restore iRoute.slnx
      - run: dotnet build iRoute.slnx --configuration Release --no-restore
      - run: npm run test:release
      - run: node tools/build-release.mjs --output artifacts/release --require-clean
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build sdks/python --outdir artifacts/python
      - uses: actions/upload-artifact@v7
        with:
          name: public-sdk-${{ github.sha }}
          path: |
            artifacts/release/
            artifacts/python/
          if-no-files-found: error
          retention-days: 3

  npm:
    if: inputs.registry == 'npm'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish artifacts/release/iroute-sdk-${{ inputs.version }}.tgz --access public

  nuget:
    if: inputs.registry == 'nuget'
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish contracts before the SDK
        run: >-
          dotnet nuget push artifacts/release/iRoute.Contracts.${{ inputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
      - name: Publish the .NET SDK
        run: >-
          dotnet nuget push artifacts/release/iRoute.Sdk.${{ inputs.version }}.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

  pypi:
    if: inputs.registry == 'pypi'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: public-sdk-${{ github.sha }}
          path: artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/python/

  crates:
    if: inputs.registry == 'crates'
    needs: verify
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the Rust SDK
        run: cargo publish --locked --manifest-path sdks/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
