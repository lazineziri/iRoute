name: release
on:
  workflow_dispatch: {}
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sdks/node
      - run: dotnet restore iRoute.slnx
      - run: dotnet build iRoute.slnx --configuration Release --no-restore
      - run: dotnet test --solution iRoute.slnx --configuration Release --no-build --no-restore
      - run: npm run test:contracts
      - run: npm run test:deployment
      - run: npm run test:regression
      - run: npm run test:release
      - run: node tools/container-smoke.mjs
      - name: Verify tag matches canonical version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./release.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - run: node tools/build-release.mjs --output artifacts/release --require-clean
      - uses: actions/upload-artifact@v7
        with:
          name: iroute-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: iroute-release-${{ github.sha }}
          path: artifacts/release
      - name: Create immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/release/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --prerelease
          --title "iRoute ${GITHUB_REF_NAME#v}"
          --notes-file artifacts/release/RELEASE_NOTES.md
