name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  verify:
    name: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release metadata and tag
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' release.json)"
          channel="$(jq -r '.channel' release.json)"
          notes="$(jq -r '.releaseNotes' release.json)"
          release_date="$(jq -r '.releaseDate // empty' release.json)"

          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          [[ "${channel}" =~ ^[a-z][a-z0-9-]*$ ]]
          test "${notes}" = "docs/releases/${version}.md"
          test -f "${notes}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            [[ "${release_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            test "${GITHUB_REF_NAME}" = "v${version}"
            test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
            tag_object="$(git rev-parse "${GITHUB_REF_NAME}^{tag}")"
            verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')"
            test "${verified}" = true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore iRoute.slnx
      - name: Verify formatting
        run: dotnet format iRoute.slnx --verify-no-changes --severity warn --no-restore
      - name: Build
        run: dotnet build iRoute.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution iRoute.slnx --configuration Release --no-build

      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          dotnet pack iRoute.slnx \
            --configuration Release \
            --no-build \
            --output artifacts/release

          packages=(iRoute.Common iRoute.Services iRoute.Data iRoute.Core iRoute)
          for package in "${packages[@]}"; do
            test -f "artifacts/release/${package}.${VERSION}.nupkg"
          done
          test "$(find artifacts/release -maxdepth 1 -type f -name '*.nupkg' | wc -l | tr -d ' ')" -eq 5

          git archive \
            --format=tar.gz \
            --prefix="iroute-${VERSION}/" \
            --output="artifacts/release/iroute-${VERSION}-source.tar.gz" \
            HEAD
          cp "${NOTES}" artifacts/release/RELEASE_NOTES.md
          (
            cd artifacts/release
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - uses: actions/upload-artifact@v7
        with:
          name: iroute-release-${{ steps.metadata.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  container:
    name: verify-container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: iroute
          POSTGRES_USER: iroute
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iroute -d iroute"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' release.json)"
          docker build --file deploy/Dockerfile --target runtime \
            --build-arg "VERSION=${version}" --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "iroute-release:${GITHUB_SHA}" .
      - name: Verify SQLite runtime
        uses: ./.github/actions/smoke-runtime
        with:
          image: iroute-release:${{ github.sha }}
      - name: Verify PostgreSQL API and worker
        uses: ./.github/actions/smoke-runtime
        with:
          image: iroute-release:${{ github.sha }}
          provider: Postgres
          connection-string: Host=host.docker.internal;Port=5432;Database=iroute;Username=iroute;Password=ci-only-password

  publish-nuget:
    name: publish-nuget
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: iroute-release-${{ needs.verify.outputs.version }}
          path: artifacts/release
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages in dependency order
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          packages=(iRoute.Common iRoute.Services iRoute.Data iRoute.Core iRoute)
          for package in "${packages[@]}"; do
            dotnet nuget push "artifacts/release/${package}.${VERSION}.nupkg" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish-container:
    name: publish-container
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, container]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iroute:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/iroute:${{ needs.verify.outputs.channel }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true

  publish-github:
    name: publish-github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, publish-nuget, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: iroute-release-${{ needs.verify.outputs.version }}
          path: artifacts/release
      - name: Create immutable GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it immutable."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/release/*.nupkg \
            artifacts/release/*-source.tar.gz \
            artifacts/release/RELEASE_NOTES.md \
            artifacts/release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "iRoute ${GITHUB_REF_NAME#v}" \
            --notes-file artifacts/release/RELEASE_NOTES.md
