name: release

on:
  workflow_dispatch: {}
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet restore iRoute.slnx
      - run: dotnet build iRoute.slnx --configuration Release --no-restore
      - name: Build .NET release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' release.json)"
          test -n "${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          notes="docs/releases/${version}.md"
          test -f "${notes}"

          mkdir -p artifacts/release
          dotnet pack src/Core/iRoute.Contracts --configuration Release --no-restore --output artifacts/release
          dotnet pack src/Clients/iRoute.Sdk.DotNet --configuration Release --no-restore --output artifacts/release
          dotnet pack src/Clients/iRoute.Cli --configuration Release --no-restore --output artifacts/release
          git archive --format=tar.gz --prefix="iroute-${version}/" --output="artifacts/release/iroute-${version}-source.tar.gz" HEAD
          cp "${notes}" artifacts/release/RELEASE_NOTES.md
          cd artifacts/release
          sha256sum ./* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: iroute-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: iroute-release-${{ github.sha }}
          path: artifacts/release
      - name: Create immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/release/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --prerelease
          --title "iRoute ${GITHUB_REF_NAME#v}"
          --notes-file artifacts/release/RELEASE_NOTES.md
