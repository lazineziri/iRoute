name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet restore iRoute.slnx
      - run: dotnet format iRoute.slnx --verify-no-changes --severity warn --no-restore
      - run: dotnet build iRoute.slnx --configuration Release --no-restore
      - run: dotnet test --solution iRoute.slnx --configuration Release --no-build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file deploy/Dockerfile --target api --tag iroute-api:test .
      - run: docker build --file deploy/Dockerfile --target worker --tag iroute-worker:test .
      - run: docker build --file deploy/Dockerfile --target migrate --tag iroute-migrations:test .

  release-readiness:
    needs: [dotnet, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet restore iRoute.slnx
      - run: dotnet pack src/iRoute.Common --configuration Release --no-restore --output artifacts/release
      - run: dotnet pack src/iRoute.Services --configuration Release --no-restore --output artifacts/release
      - run: dotnet pack src/iRoute.Data --configuration Release --no-restore --output artifacts/release
      - run: dotnet pack src/iRoute.Core --configuration Release --no-restore --output artifacts/release
      - run: dotnet pack src/iRoute.Runtime --configuration Release --no-restore --output artifacts/release
      - uses: actions/upload-artifact@v7
        with:
          name: iroute-dotnet-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7
