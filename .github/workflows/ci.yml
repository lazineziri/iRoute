name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet restore iRoute.slnx
      - run: dotnet build iRoute.slnx -c Release --no-restore
      - run: dotnet run --project tests/iRoute.UnitTests -c Release --no-build -- -reporter quiet
      - run: dotnet run --project tests/iRoute.ArchitectureTests -c Release --no-build -- -reporter quiet
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npx --yes @redocly/cli@latest lint spec/openapi/iroute.v1.yaml
      - run: npm run test:contracts
      - run: npm run test:regression
      - run: npm ci --prefix sdks/node
      - run: npm run check --prefix sdks/node
      - run: npm test --prefix sdks/node
      - run: node --check examples/sdks/node/execute.mjs
  sdk-python:
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONPATH=sdks/python/src python -m unittest discover -s sdks/python/tests -v
      - run: python -m compileall -q sdks/python/src sdks/python/tests examples/sdks/python
  sdk-java:
    runs-on: ubuntu-latest
    container: eclipse-temurin:25-jdk
    steps:
      - uses: actions/checkout@v4
      - run: ./run-conformance.sh
        working-directory: sdks/java
      - run: javac --release 25 -Xlint:all -Werror -cp target/conformance-classes -d target/example-classes ../../examples/sdks/java/ExecuteExample.java
        working-directory: sdks/java
  sdk-php:
    runs-on: ubuntu-latest
    container: php:8.5-cli
    steps:
      - uses: actions/checkout@v4
      - run: find sdks/php/src sdks/php/tests examples/sdks/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/conformance.php
        working-directory: sdks/php
  sdk-rust:
    runs-on: ubuntu-latest
    container: rust:1.97.1
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path sdks/rust/Cargo.toml
      - run: cargo check --manifest-path sdks/rust/Cargo.toml --example execute
