apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroute-worker
  namespace: iroute
  labels:
    app.kubernetes.io/name: iroute
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iroute
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iroute
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: iroute-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/your-org/iroute-worker:0.1.0-alpha.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: iroute-config
          env:
            - name: ConnectionStrings__iRoute
              valueFrom:
                secretKeyRef:
                  name: iroute-secrets
                  key: ConnectionStrings__iRoute
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
