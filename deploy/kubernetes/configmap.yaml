apiVersion: v1
kind: ConfigMap
metadata:
  name: iroute-config
  namespace: iroute
  labels:
    app.kubernetes.io/name: iroute
data:
  ASPNETCORE_ENVIRONMENT: Production
  Storage__Provider: Postgres
  Storage__AutoInitialize: "false"
  ModelGateway__Mode: Http
  ModelGateway__BaseUrl: https://model-gateway.example.invalid
  ModelGateway__GatewayId: production-gateway
  ModelGateway__Transport: Buffered
  ModelGateway__Resilience__Enabled: "true"
  ModelGateway__Resilience__MaximumAttempts: "3"
  ModelGateway__Resilience__Circuit__FailureThreshold: "3"
  ModelGateway__Resilience__Circuit__OpenDuration: 00:00:30
  ModelGateway__Resilience__Circuit__MaximumOpenDuration: 00:05:00
  ModelGateway__Resilience__Circuit__ProbeLeaseDuration: 00:00:15
  Workflow__QueueCapacity: "16"
  Workflow__MaxParallelSteps: "4"
  Workflow__RetryBaseDelayMilliseconds: "100"
  Workflow__RetryMaxDelayMilliseconds: "5000"
  Workflow__RetryJitterRatio: "0.2"
  ExecutionWorker__PollInterval: 00:00:00.250
  ExecutionWorker__LeaseDuration: 00:00:30
  ExecutionWorker__HeartbeatInterval: 00:00:05
  ExecutionWorker__AbandonDelay: 00:00:01
  Identity__Mode: Jwt
  Identity__Authority: https://identity.example.invalid
  Identity__Audience: iroute
  Identity__PermissionClaim: scope
  Observability__PayloadMode: MetadataOnly
  Observability__MaxQueryDays: "90"
  Observability__MaxExecutions: "1000"
  Observability__MaxTimelineEvents: "1000"
  Observability__MaxEventValueCharacters: "1000"
  Observability__MaxRecentExecutions: "25"
  Lifecycle__SweepInterval: 00:05:00
  Lifecycle__DefaultArtifactTimeToLive: 30.00:00:00
  Lifecycle__DefaultMemoryTimeToLive: 90.00:00:00
  Lifecycle__ArchiveAfterInactive: 7.00:00:00
  Lifecycle__DeleteAfterArchive: 7.00:00:00
  Lifecycle__ArchiveRetention: 30.00:00:00
  Lifecycle__MaxArtifactVersionsPerLineage: "5"
  Lifecycle__MaxMemoryVersionsPerLineage: "5"
  Lifecycle__MaxArtifactsPerTenant: "10000"
  Lifecycle__MaxMemoryRecordsPerTenant: "10000"
  Lifecycle__MaxArchivesPerTenant: "20000"
  Lifecycle__BatchSize: "500"
