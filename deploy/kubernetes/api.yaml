apiVersion: apps/v1
kind: Deployment
metadata:
  name: iroute-api
  namespace: iroute
  labels:
    app.kubernetes.io/name: iroute
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iroute
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iroute
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: iroute-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: iroute
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/your-org/iroute-api:0.1.0-alpha.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iroute-config
          env:
            - name: ConnectionStrings__iRoute
              valueFrom:
                secretKeyRef:
                  name: iroute-secrets
                  key: ConnectionStrings__iRoute
            - name: ModelGateway__ApiKey
              valueFrom:
                secretKeyRef:
                  name: iroute-secrets
                  key: ModelGateway__ApiKey
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iroute-api
  namespace: iroute
  labels:
    app.kubernetes.io/name: iroute
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iroute
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iroute-api
  namespace: iroute
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iroute
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iroute-api
  namespace: iroute
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iroute-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
