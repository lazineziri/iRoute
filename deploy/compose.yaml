name: iroute
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: Postgres
      Storage__AutoInitialize: "true"
      ConnectionStrings__iRoute: Host=postgres;Port=5432;Database=iroute;Username=iroute;Password=${IROUTE_DB_PASSWORD:-local-development-only}
      ModelGateway__Mode: ${IROUTE_MODEL_GATEWAY_MODE:-Deterministic}
      ModelGateway__BaseUrl: ${IROUTE_MODEL_GATEWAY_URL:-}
      ModelGateway__ApiKey: ${IROUTE_MODEL_GATEWAY_KEY:-}
      ModelGateway__GatewayId: ${IROUTE_MODEL_GATEWAY_ID:-external}
      ModelGateway__Transport: ${IROUTE_MODEL_GATEWAY_TRANSPORT:-Buffered}
      Workflow__QueueCapacity: ${IROUTE_WORKFLOW_QUEUE_CAPACITY:-16}
      Workflow__MaxParallelSteps: ${IROUTE_WORKFLOW_MAX_PARALLEL_STEPS:-4}
      Identity__Mode: ${IROUTE_IDENTITY_MODE:-DevelopmentHeaders}
      Identity__Authority: ${IROUTE_IDENTITY_AUTHORITY:-}
      Identity__Audience: ${IROUTE_IDENTITY_AUDIENCE:-}
      Identity__PermissionClaim: ${IROUTE_IDENTITY_PERMISSION_CLAIM:-scope}
      Observability__PayloadMode: ${IROUTE_OBSERVABILITY_PAYLOAD_MODE:-MetadataOnly}
      Observability__MaxQueryDays: ${IROUTE_OBSERVABILITY_MAX_QUERY_DAYS:-90}
      Observability__MaxExecutions: ${IROUTE_OBSERVABILITY_MAX_EXECUTIONS:-1000}
      Observability__MaxTimelineEvents: ${IROUTE_OBSERVABILITY_MAX_TIMELINE_EVENTS:-1000}
      Observability__MaxEventValueCharacters: ${IROUTE_OBSERVABILITY_MAX_EVENT_CHARACTERS:-1000}
      Observability__MaxRecentExecutions: ${IROUTE_OBSERVABILITY_MAX_RECENT_EXECUTIONS:-25}
      Lifecycle__DefaultArtifactTimeToLive: ${IROUTE_ARTIFACT_TTL:-30.00:00:00}
      Lifecycle__DefaultMemoryTimeToLive: ${IROUTE_MEMORY_TTL:-90.00:00:00}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      Storage__Provider: Postgres
      Storage__AutoInitialize: "true"
      ConnectionStrings__iRoute: Host=postgres;Port=5432;Database=iroute;Username=iroute;Password=${IROUTE_DB_PASSWORD:-local-development-only}
      Lifecycle__SweepInterval: ${IROUTE_LIFECYCLE_SWEEP_INTERVAL:-00:05:00}
      Lifecycle__DefaultArtifactTimeToLive: ${IROUTE_ARTIFACT_TTL:-30.00:00:00}
      Lifecycle__DefaultMemoryTimeToLive: ${IROUTE_MEMORY_TTL:-90.00:00:00}
      Lifecycle__ArchiveAfterInactive: ${IROUTE_ARCHIVE_AFTER_INACTIVE:-7.00:00:00}
      Lifecycle__DeleteAfterArchive: ${IROUTE_DELETE_AFTER_ARCHIVE:-7.00:00:00}
      Lifecycle__ArchiveRetention: ${IROUTE_ARCHIVE_RETENTION:-30.00:00:00}
      Lifecycle__MaxArtifactVersionsPerLineage: ${IROUTE_MAX_ARTIFACT_VERSIONS:-5}
      Lifecycle__MaxMemoryVersionsPerLineage: ${IROUTE_MAX_MEMORY_VERSIONS:-5}
      Lifecycle__MaxArtifactsPerTenant: ${IROUTE_MAX_ARTIFACTS_PER_TENANT:-10000}
      Lifecycle__MaxMemoryRecordsPerTenant: ${IROUTE_MAX_MEMORY_PER_TENANT:-10000}
      Lifecycle__MaxArchivesPerTenant: ${IROUTE_MAX_ARCHIVES_PER_TENANT:-20000}
      Lifecycle__BatchSize: ${IROUTE_LIFECYCLE_BATCH_SIZE:-500}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: iroute
      POSTGRES_USER: iroute
      POSTGRES_PASSWORD: ${IROUTE_DB_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iroute -d iroute"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
